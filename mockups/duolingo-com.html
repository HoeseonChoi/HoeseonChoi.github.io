<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 재고 — Duolingo style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #58cc02;        /* tree-frog family (spec: #5ccc04) */
    --green-dark: #46a302;
    --blue: #1cb0f6;         /* macaw */
    --blue-deep: #2b70c9;    /* humpback */
    --blue-dark: #1899d6;
    --gold: #f4b811;         /* dominant yellow */
    --fox: #ff9600;          /* fox-always-light */
    --pink: #f8b8d7;
    --eel: #3c3c3c;
    --wolf: #777777;
    --koala: #485a62;        /* koala-always-dark 72,90,98 */
    --line: #e5e5e5;
    --cloud: #dddddd;
    --polar: #f7f7f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #dfe4ea;
    font-family: 'Nunito', sans-serif;
  }

  /* ---------- phone frame 390×844 ---------- */
  .phone {
    position: relative;
    width: 390px; height: 844px;
    background: #fff;
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 40px 90px -30px rgba(60,60,60,.5), 0 0 0 10px #20242a, 0 0 0 12px #4a5058;
  }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; border-radius: 34px; overflow: hidden; background: #fff; }
  .scroll { flex: 1; padding: 26px 16px 4px; overflow: hidden; }

  /* ---------- header ---------- */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
  .house { font-weight: 900; font-size: 25px; color: var(--eel); letter-spacing: -.4px; display: flex; align-items: center; gap: 8px; }
  .house .owl {
    width: 32px; height: 32px; border-radius: 10px;
    background: var(--green);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 3px 0 var(--green-dark);
  }
  .header-links { display: flex; gap: 6px; }
  .header-links span {
    font-size: 11.5px; font-weight: 800; color: var(--blue-deep);
    padding: 5px 11px; border-radius: 11px;
    border: 2px solid var(--line); border-bottom-width: 3px; background: #fff;
  }

  /* ---------- quick actions — chunky 3D pushbuttons ---------- */
  .cta { display: flex; gap: 10px; margin-bottom: 11px; }
  .btn {
    flex: 1; height: 46px; border: none; border-radius: 13px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: 'Nunito', sans-serif; font-size: 14.5px; font-weight: 800; letter-spacing: .8px;
  }
  .btn.primary {
    background: var(--green); color: #fff;
    box-shadow: 0 4px 0 var(--green-dark);
    text-shadow: 0 1px 0 rgba(0,0,0,.12);
  }
  .btn.secondary {
    background: #fff; color: var(--blue);
    border: 2px solid var(--line);
    box-shadow: 0 4px 0 var(--line);
  }
  .btn svg { width: 18px; height: 18px; }

  /* ---------- sections ---------- */
  .sec { margin-bottom: 7px; }
  .sec-head { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; padding: 0 2px; }
  .sec-title { font-weight: 900; font-size: 15.5px; color: var(--eel); letter-spacing: -.2px; }
  .count {
    font-size: 11px; font-weight: 900; color: #fff;
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--wolf);
  }
  .count.warn { background: var(--fox); }
  .count.exp { background: var(--gold); color: #7a5b00; }
  .sec-action { margin-left: auto; font-size: 12.5px; font-weight: 800; color: var(--blue-deep); letter-spacing: .4px; }

  .rows { border: 2px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff; }
  .row { display: flex; align-items: center; gap: 10px; padding: 4.5px 12px; }
  .row + .row { border-top: 2px solid var(--polar); }

  .face {
    width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
    border-bottom: 3px solid rgba(0,0,0,.08);
  }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-weight: 800; font-size: 14px; color: var(--eel); }
  .row-meta { font-size: 11.5px; font-weight: 600; color: var(--wolf); margin-top: 0; }
  .row-qty { font-weight: 900; font-size: 16px; color: var(--eel); }
  .row-qty.zero { color: var(--fox); }
  .row-qty small { font-size: 11px; font-weight: 700; color: var(--wolf); }

  .dchip {
    font-weight: 900; font-size: 11.5px; padding: 4px 10px; border-radius: 10px;
    border-bottom: 3px solid rgba(0,0,0,.12); letter-spacing: .3px;
  }
  .dchip.d1 { background: var(--fox); color: #fff; }
  .dchip.d2 { background: var(--gold); color: #7a5b00; }
  .dchip.d3 { background: #e9f6d8; color: var(--green-dark); border-color: rgba(88,167,0,.25); }

  /* stepper — mini pushbuttons */
  .step { display: flex; align-items: center; gap: 7px; }
  .step button {
    width: 28px; height: 28px; border-radius: 9px;
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .step .minus { background: #fff; color: var(--wolf); border: 2px solid var(--line); box-shadow: 0 2.5px 0 var(--line); }
  .step .plus { background: var(--green); color: #fff; border: none; box-shadow: 0 2.5px 0 var(--green-dark); }
  .step .q { font-weight: 900; font-size: 15px; color: var(--eel); min-width: 20px; text-align: center; }

  /* search + chips */
  .search {
    display: flex; align-items: center; gap: 8px;
    border: 2px solid var(--line); border-radius: 13px; height: 34px; padding: 0 13px;
    background: var(--polar); color: var(--wolf); font-size: 12.5px; font-weight: 700;
    margin-bottom: 7px;
  }
  .search svg { width: 15px; height: 15px; }
  .chips { display: flex; gap: 7px; margin-bottom: 7px; }
  .chip {
    font-size: 11.5px; font-weight: 800; padding: 5px 12px; border-radius: 11px;
    border: 2px solid var(--line); border-bottom-width: 3px; background: #fff; color: var(--wolf);
  }
  .chip.on { background: #ddf4ff; border-color: #84d8ff; border-bottom-color: #55c3f5; color: var(--blue-deep); }
  .more { text-align: center; font-size: 12.5px; font-weight: 800; color: var(--blue-deep); letter-spacing: .4px; padding: 6px 0 0; }

  /* ---------- tab bar ---------- */
  .tabbar {
    border-top: 2px solid var(--line);
    background: #fff;
    display: flex; padding: 6px 10px 13px;
  }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--wolf); }
  .tab svg { width: 22px; height: 22px; }
  .tab span { font-size: 10.5px; font-weight: 800; }
  .tab.on { color: var(--blue); }
  .tab.on .pill { background: #ddf4ff; border-radius: 12px; padding: 3px 14px 4px; margin: -3px -14px -1px; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="scroll">
      <div class="header">
        <div class="house"><span class="owl">🦉</span>우리집</div>
        <div class="header-links"><span>가족</span><span>설정</span></div>
      </div>

      <div class="cta">
        <button class="btn primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M8 9v6M12 9v6M16 9v6" stroke-width="2.2"/></svg>
          스캔해서 추가
        </button>
        <button class="btn secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          바로 사용
        </button>
      </div>

      <!-- 구매 필요 -->
      <div class="sec">
        <div class="sec-head">
          <span class="sec-title">구매 필요</span><span class="count warn">2</span>
          <span class="sec-action">장보기 →</span>
        </div>
        <div class="rows">
          <div class="row">
            <div class="face" style="background:#ffe9f3">🍮</div>
            <div class="row-main"><div class="row-name">두부</div><div class="row-meta">300g · 최소 2개</div></div>
            <div class="row-qty zero">0<small>개</small></div>
          </div>
          <div class="row">
            <div class="face" style="background:#e6f3ff">🧺</div>
            <div class="row-main"><div class="row-name">세탁세제</div><div class="row-meta">2L · 최소 1개</div></div>
            <div class="row-qty">1<small>개</small></div>
          </div>
        </div>
      </div>

      <!-- 유통기한 임박 -->
      <div class="sec">
        <div class="sec-head">
          <span class="sec-title">유통기한 임박</span><span class="count exp">3</span>
        </div>
        <div class="rows">
          <div class="row">
            <div class="face" style="background:#e6f3ff">🥛</div>
            <div class="row-main"><div class="row-name">서울우유</div><div class="row-meta">1L · 냉장고 · 2개</div></div>
            <span class="dchip d1">D-1</span>
          </div>
          <div class="row">
            <div class="face" style="background:#fff3d6">🥣</div>
            <div class="row-main"><div class="row-name">그릭요거트</div><div class="row-meta">450g · 냉장고 · 1개</div></div>
            <span class="dchip d2">D-2</span>
          </div>
          <div class="row">
            <div class="face" style="background:#e9f6d8">🥚</div>
            <div class="row-main"><div class="row-name">계란</div><div class="row-meta">30구 · 냉장고 · 10개</div></div>
            <span class="dchip d3">D-4</span>
          </div>
        </div>
      </div>

      <!-- 최근 사용 -->
      <div class="sec">
        <div class="sec-head">
          <span class="sec-title">최근 사용</span><span class="count">2</span>
        </div>
        <div class="rows">
          <div class="row">
            <div class="face" style="background:#e9f6d8">🥚</div>
            <div class="row-main"><div class="row-name">계란</div><div class="row-meta">30구</div></div>
            <div class="step"><button class="minus">−</button><span class="q">10</span><button class="plus">+</button></div>
          </div>
          <div class="row">
            <div class="face" style="background:#fdeecd">🧅</div>
            <div class="row-main"><div class="row-name">양파</div><div class="row-meta">1망</div></div>
            <div class="step"><button class="minus">−</button><span class="q">4</span><button class="plus">+</button></div>
          </div>
        </div>
      </div>

      <!-- 전체 재고 -->
      <div class="sec">
        <div class="sec-head">
          <span class="sec-title">전체 재고</span><span class="count">12</span>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          상품명·브랜드 검색
        </div>
        <div class="chips">
          <span class="chip on">전체</span><span class="chip">냉장고</span><span class="chip">냉동고</span><span class="chip">팬트리</span>
        </div>
        <div class="rows">
          <div class="row">
            <div class="face" style="background:#e6f3ff">🥛</div>
            <div class="row-main"><div class="row-name">서울우유</div><div class="row-meta">냉장고 · 유통기한 09/24</div></div>
            <div class="step"><button class="minus">−</button><span class="q">2</span><button class="plus">+</button></div>
          </div>
          <div class="row">
            <div class="face" style="background:#e9f6d8">🥚</div>
            <div class="row-main"><div class="row-name">계란</div><div class="row-meta">냉장고 · 유통기한 09/27</div></div>
            <div class="step"><button class="minus">−</button><span class="q">10</span><button class="plus">+</button></div>
          </div>
        </div>
        <div class="more">더 보기 · 전체 12개</div>
      </div>
    </div>

    <div class="tabbar">
      <div class="tab on">
        <div class="pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
        </div>
        <span>홈</span>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5 12 3l8 3.5v11L12 21l-8-3.5z"/><path d="M4 6.5 12 10l8-3.5M12 10v11"/></svg>
        <span>재고</span>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/><path d="M3 4h2.4l2.6 12h10.4l2-8.5H7"/></svg>
        <span>장보기</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
