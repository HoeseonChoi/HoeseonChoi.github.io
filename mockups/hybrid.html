<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리집 — Hybrid (Alma × Duolingo × Ghost)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Noto+Serif+KR:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --kiwi:#aadf49;
    --kiwi-deep:#6f9420;
    --collard:#3c5627;
    --aioli:#f7f5ed;
    --yogurt:#fffdf5;
    --surface:#fffefc;
    --teriyaki:#33140c;
    --muted:#a1a1a1;
    --sage:#61929a;
    --teal:#146c84;
    --apricot:#f3b34f;
    --terra:#b0562e;
    --moss:#cecca1;
    --edge:#1f2c13;
    --serif:"Fraunces","Noto Serif KR",Georgia,serif;
    --sans:"Instrument Sans","Noto Sans KR","Helvetica Neue",sans-serif;
    --btn-grad:linear-gradient(to bottom,#45632d,#2b3d1c);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{height:100%}
  body{
    background:#e9e4d8;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--sans);
  }
  .frame{
    width:390px;height:844px;flex:none;
    background:
      radial-gradient(120% 60% at 50% -8%, #eef0d4 0%, transparent 55%),
      var(--aioli);
    border-radius:44px;
    overflow:hidden;
    position:relative;
    box-shadow:0 40px 80px -30px rgba(60,86,39,.35), 0 0 0 1px rgba(60,86,39,.12);
    display:flex;flex-direction:column;
  }
  .scroll{flex:1;overflow:hidden;padding:0 20px}

  /* status bar */
  .status{display:flex;justify-content:space-between;align-items:center;
    padding:5px 10px 0;color:var(--teriyaki);font-size:12px;font-weight:600}
  .status .glyphs{display:flex;gap:5px;align-items:center;opacity:.85}

  /* header */
  header{padding:3px 4px 4px}
  .kicker{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    color:var(--sage);margin-bottom:3px}
  .title-row{display:flex;align-items:flex-end;justify-content:space-between}
  h1{font-family:var(--serif);font-weight:500;font-size:28px;line-height:.95;
    color:var(--collard);letter-spacing:-.01em}
  h1 em{font-style:italic;font-weight:400}
  .nav-links{display:flex;gap:14px;padding-bottom:6px}
  .nav-links a{font-size:12.5px;font-weight:500;color:var(--teal);text-decoration:none;
    border-bottom:1px solid rgba(20,108,132,.35);padding-bottom:1px}

  /* ── stat strip (Ghost signature, Alma palette) ── */
  .stats{
    margin:0 0 7px;padding:6px 8px 5px;
    background:var(--yogurt);border-radius:20px;
    display:flex;align-items:center;
    box-shadow:0 18px 30px -22px rgba(51,20,12,.30), inset 0 0 0 1px rgba(60,86,39,.08);
  }
  .stat{flex:1;text-align:center;position:relative}
  .stat + .stat::before{
    content:"";position:absolute;left:0;top:14%;bottom:14%;width:1px;
    background:rgba(60,86,39,.14);
  }
  .stat .n{
    font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:-.01em;
    color:var(--collard);font-variant-numeric:tabular-nums;line-height:1.05;
  }
  .stat .n.warn{color:var(--terra)}
  .stat .n.kiwi{color:var(--kiwi-deep)}
  .stat .l{
    margin-top:2px;font-size:9px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--sage);
  }

  /* ── hero CTA card — Duolingo 3D pushbuttons on Alma skin ── */
  .cta-card{
    background:var(--yogurt);
    border-radius:32px;
    padding:8px;
    display:flex;gap:8px;
    box-shadow:0 24px 40px -22px rgba(51,20,12,.28), inset 0 0 0 1px rgba(60,86,39,.08);
    margin-bottom:8px;
  }
  .btn{flex:1;height:41px;border:none;cursor:pointer;border-radius:50px;
    display:flex;align-items:center;justify-content:center;gap:7px;
    font-family:var(--sans);font-size:12.5px;font-weight:600;
    transition:transform .07s ease, box-shadow .07s ease}
  .btn-primary{background:var(--btn-grad);color:#f7f5ed;
    box-shadow:0 4px 0 var(--edge), 0 15px 14px -10px rgba(0,0,0,.18), inset 0 0 0 1px rgba(0,0,0,.2)}
  .btn-primary:active{transform:translateY(4px);
    box-shadow:0 0 0 var(--edge), 0 8px 10px -8px rgba(0,0,0,.12), inset 0 0 0 1px rgba(0,0,0,.2)}
  .btn-primary svg{stroke:var(--kiwi)}
  .btn-secondary{background:var(--surface);color:var(--collard);
    box-shadow:0 4px 0 rgba(60,86,39,.30), inset 0 0 0 1.5px rgba(60,86,39,.4)}
  .btn-secondary:active{transform:translateY(4px);
    box-shadow:0 0 0 rgba(60,86,39,0), inset 0 0 0 1.5px rgba(60,86,39,.4)}

  /* sections */
  section{margin-bottom:5px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;
    padding:0 4px;margin-bottom:3px}
  .sec-title{font-family:var(--serif);font-weight:500;font-size:17px;color:var(--teriyaki);
    letter-spacing:-.01em}
  .sec-meta{display:flex;align-items:center;gap:8px}
  .sec-count{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
  .sec-link{font-size:11px;font-weight:600;color:var(--teal);text-decoration:none}

  .rows{display:flex;flex-direction:column;gap:4px}
  .row{
    background:var(--yogurt);
    border-radius:18px;
    padding:4px 14px;
    display:flex;align-items:center;gap:10px;
    box-shadow:0 10px 20px -14px rgba(51,20,12,.22), inset 0 0 0 1px rgba(60,86,39,.06);
  }
  .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .dot.warn{background:var(--apricot)}
  .dot.ok{background:var(--kiwi)}
  .row-main{flex:1;min-width:0}
  .row-name{font-size:13.5px;font-weight:600;color:var(--teriyaki);line-height:1.25}
  .row-sub{font-size:10.5px;color:var(--muted);margin-top:1px}
  .row-qty{font-family:var(--serif);font-size:18px;font-weight:500;color:var(--collard);white-space:nowrap}
  .row-qty small{font-size:11px;font-family:var(--sans);color:var(--muted);font-weight:500}
  .qty-zero{color:var(--terra)}

  /* expiry chips */
  .chip{
    font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:50px;white-space:nowrap;
  }
  .chip-d1{background:var(--kiwi);color:#2b3d1c}
  .chip-d2{background:var(--moss);color:#4a4a22}

  /* steppers — mini 3D pushbuttons */
  .stepper{display:flex;align-items:center;gap:4px}
  .step-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(60,86,39,.35);
    background:var(--surface);color:var(--collard);font-size:14px;font-weight:500;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
    box-shadow:0 3px 0 rgba(60,86,39,.22);
    transition:transform .06s ease, box-shadow .06s ease}
  .step-btn:active{transform:translateY(3px);box-shadow:0 0 0 rgba(60,86,39,0)}
  .step-btn.add{background:var(--btn-grad);color:#f7f5ed;border-color:transparent;
    box-shadow:0 3px 0 var(--edge)}
  .step-btn.add:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
  .stepper .qty{min-width:26px;text-align:center;font-family:var(--serif);
    font-size:15px;font-weight:500;color:var(--teriyaki)}

  /* search + filter */
  .search{
    display:flex;align-items:center;gap:8px;
    background:var(--yogurt);border-radius:50px;padding:5px 16px;margin-bottom:4px;
    box-shadow:inset 0 0 0 1px rgba(60,86,39,.15);
  }
  .search input{border:none;background:transparent;outline:none;flex:1;
    font-family:var(--sans);font-size:12.5px;color:var(--teriyaki)}
  .search input::placeholder{color:var(--muted)}
  .chips{display:flex;gap:5px;margin-bottom:4px;padding:0 2px}
  .fchip{font-size:10.5px;font-weight:600;padding:4px 11px;border-radius:50px;cursor:pointer;
    color:var(--collard);box-shadow:inset 0 0 0 1px rgba(60,86,39,.3);background:transparent}
  .fchip.on{background:var(--collard);color:var(--yogurt);box-shadow:none}
  .more{display:block;text-align:center;font-size:11.5px;font-weight:600;color:var(--teal);
    padding:2px 0 0;text-decoration:none}

  /* tab bar */
  .tabbar-wrap{padding:4px 20px 12px}
  .tabbar{
    background:var(--yogurt);border-radius:50px;
    display:flex;justify-content:space-around;
    padding:6px;
    box-shadow:0 24px 44px -20px rgba(51,20,12,.32), inset 0 0 0 1px rgba(60,86,39,.08);
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:1px;
    padding:5px 20px;border-radius:40px;color:var(--muted);cursor:pointer}
  .tab svg{stroke:currentColor}
  .tab span{font-size:10px;font-weight:600;letter-spacing:.02em}
  .tab.active{background:var(--btn-grad);color:#f7f5ed;
    box-shadow:0 12px 18px -10px rgba(43,61,28,.5)}
  .tab.active svg{stroke:var(--kiwi)}
</style>
</head>
<body>
<div class="frame">
  <div class="scroll">
    <div class="status">
      <span>9:41</span>
      <span class="glyphs">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="4.5" width="3" height="6.5" rx="1"/><rect x="9" y="2" width="3" height="9" rx="1"/><rect x="13" y="0" width="3" height="11" rx="1" opacity=".35"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="20" height="10" rx="3"/><rect x="2.5" y="2.5" width="14" height="6" rx="1.5" fill="currentColor" stroke="none"/><path d="M22.5 3.5v4" stroke-linecap="round"/></svg>
      </span>
    </div>

    <header>
      <div class="kicker">September 23 · 수요일</div>
      <div class="title-row">
        <h1>우리<em>집</em></h1>
        <nav class="nav-links"><a href="#">가족</a><a href="#">설정</a></nav>
      </div>
    </header>

    <!-- stat strip: Ghost layout, Alma moss/kiwi retone -->
    <div class="stats">
      <div class="stat"><div class="n">24</div><div class="l">등록 상품</div></div>
      <div class="stat"><div class="n warn">3</div><div class="l">구매 필요</div></div>
      <div class="stat"><div class="n kiwi">2</div><div class="l">임박</div></div>
    </div>

    <div class="cta-card">
      <button class="btn btn-primary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M4 7V5a1 1 0 011-1h2M17 4h2a1 1 0 011 1v2M20 17v2a1 1 0 01-1 1h-2M7 20H5a1 1 0 01-1-1v-2M4 12h16"/></svg>
        스캔해서 추가
      </button>
      <button class="btn btn-secondary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        바로 사용
      </button>
    </div>

    <section>
      <div class="sec-head">
        <div class="sec-title">구매 필요</div>
        <div class="sec-meta"><span class="sec-count">3 items</span><a class="sec-link" href="#">장보기 →</a></div>
      </div>
      <div class="rows">
        <div class="row"><span class="dot warn"></span>
          <div class="row-main"><div class="row-name">두부</div><div class="row-sub">300g · 최소 1개</div></div>
          <div class="row-qty qty-zero">0<small>개</small></div>
        </div>
        <div class="row"><span class="dot warn"></span>
          <div class="row-main"><div class="row-name">물티슈</div><div class="row-sub">80매 · 최소 2개</div></div>
          <div class="row-qty">1<small>개</small></div>
        </div>
        <div class="row"><span class="dot warn"></span>
          <div class="row-main"><div class="row-name">계란</div><div class="row-sub">특란 30구 · 최소 6개</div></div>
          <div class="row-qty">2<small>개</small></div>
        </div>
      </div>
    </section>

    <section>
      <div class="sec-head">
        <div class="sec-title">유통기한 임박</div>
        <div class="sec-meta"><span class="sec-count">2 items</span></div>
      </div>
      <div class="rows">
        <div class="row">
          <div class="row-main"><div class="row-name">우유</div><div class="row-sub">1L · 냉장고 · 2개</div></div>
          <span class="chip chip-d1">D-1</span>
        </div>
        <div class="row">
          <div class="row-main"><div class="row-name">스트링 치즈</div><div class="row-sub">냉장고 · 1개</div></div>
          <span class="chip chip-d2">D-2</span>
        </div>
      </div>
    </section>

    <section>
      <div class="sec-head">
        <div class="sec-title">최근 사용</div>
        <div class="sec-meta"><span class="sec-count">2 items</span></div>
      </div>
      <div class="rows">
        <div class="row">
          <div class="row-main"><div class="row-name">계란</div><div class="row-sub">특란 30구 · 냉장고</div></div>
          <div class="stepper"><button class="step-btn">−</button><span class="qty">2</span><button class="step-btn add">+</button></div>
        </div>
        <div class="row">
          <div class="row-main"><div class="row-name">양파</div><div class="row-sub">1망 · 팬트리</div></div>
          <div class="stepper"><button class="step-btn">−</button><span class="qty">4</span><button class="step-btn add">+</button></div>
        </div>
      </div>
    </section>

    <section>
      <div class="sec-head">
        <div class="sec-title">전체 재고</div>
        <div class="sec-meta"><span class="sec-count">24 items</span></div>
      </div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a1a1a1" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input placeholder="상품명·브랜드 검색">
      </div>
      <div class="chips">
        <span class="fchip on">전체</span><span class="fchip">냉장고</span><span class="fchip">냉동실</span><span class="fchip">팬트리</span>
      </div>
      <div class="rows">
        <div class="row"><span class="dot ok"></span>
          <div class="row-main"><div class="row-name">식빵</div><div class="row-sub">팬트리</div></div>
          <div class="row-qty">1<small>개</small></div>
        </div>
      </div>
      <a class="more" href="#">전체 24개 더 보기 ↓</a>
    </section>
  </div>

  <div class="tabbar-wrap">
    <nav class="tabbar">
      <div class="tab active">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20a1 1 0 001 1h11a1 1 0 001-1V9.5"/></svg>
        <span>홈</span>
      </div>
      <div class="tab">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.5 8.5L12 13l8.5-4.5M12 13v8.5"/></svg>
        <span>재고</span>
      </div>
      <div class="tab">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2.5l2.4 11h9.6l2-8H6"/></svg>
        <span>장보기</span>
      </div>
    </nav>
  </div>
</div>
</body>
</html>
