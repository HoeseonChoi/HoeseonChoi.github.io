<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 재고 — Tokens Studio style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #11c8d5;
    --pink: #fc79a4;
    --ink: #251d5c;
    --purple: #605ea7;
    --sage: #c6cdaa;
    --paper: #f7f6f2;
    --card: #ffffff;
    --ink-60: rgba(37, 29, 92, .6);
    --ink-35: rgba(37, 29, 92, .35);
  }
  ::selection { background: #A499FF; color: #211C4D; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #e9e7e0;
    font-family: 'Lato', sans-serif;
  }

  /* ---------- phone frame 390×844 ---------- */
  .phone {
    position: relative;
    width: 390px; height: 844px;
    background: var(--paper);
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 40px 90px -30px rgba(37,29,92,.45), 0 0 0 10px #1c163f, 0 0 0 12px #3a2f7e;
  }
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    border-radius: 34px;
    overflow: hidden;
    background:
      radial-gradient(340px 240px at 110% -6%, rgba(17,200,213,.16), transparent 65%),
      radial-gradient(300px 220px at -20% 30%, rgba(252,121,164,.10), transparent 60%),
      var(--paper);
  }

  /* floating candy blocks — tokens.studio signature isometric pastel shapes */
  .cube { position: absolute; border-radius: 12px; transform: rotate(18deg) skew(-6deg); }
  .cube.c1 { width: 46px; height: 46px; right: 26px; top: 30px;
    background: linear-gradient(135deg, #37dbe6, var(--cyan));
    box-shadow: -10px 12px 0 -4px rgba(17,200,213,.35), 0 18px 30px -12px rgba(17,200,213,.55); }
  .cube.c2 { width: 26px; height: 26px; right: 84px; top: 66px;
    background: linear-gradient(135deg, #ff9bbb, var(--pink));
    box-shadow: -7px 9px 0 -3px rgba(252,121,164,.35), 0 14px 22px -10px rgba(252,121,164,.6); }
  .cube.c3 { width: 18px; height: 18px; right: 52px; top: 96px;
    background: linear-gradient(135deg, #837fdd, var(--purple));
    box-shadow: 0 12px 18px -8px rgba(96,94,167,.7); }

  .scroll { flex: 1; padding: 32px 18px 6px; overflow: hidden; position: relative; }

  /* ---------- header ---------- */
  .header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 11px; }
  .house {
    font-family: 'Archivo', sans-serif; font-weight: 900;
    font-size: 29px; letter-spacing: -1.3px; line-height: .95;
    color: var(--ink);
  }
  .house em { font-style: normal; color: var(--purple); }
  .header-links { display: flex; gap: 8px; padding-bottom: 2px; }
  .header-links span {
    font-size: 12px; font-weight: 700; color: var(--ink-60);
    padding: 6px 12px; border-radius: 999px;
    background: rgba(255,255,255,.75); border: 1px solid rgba(37,29,92,.08);
  }

  /* ---------- quick actions ---------- */
  .cta-card {
    background: var(--card); border-radius: 24px; padding: 8px;
    box-shadow: 0 24px 40px -24px rgba(37,29,92,.35), 0 2px 0 rgba(37,29,92,.04);
    display: flex; gap: 8px; margin-bottom: 12px;
    border: 1px solid rgba(37,29,92,.05);
  }
  .btn {
    flex: 1; height: 46px; border-radius: 16px; border: none;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    font-family: 'Lato', sans-serif; font-size: 14px; font-weight: 900; letter-spacing: .2px;
  }
  .btn.primary {
    background: linear-gradient(160deg, #2fd9e4, var(--cyan) 70%);
    color: #062a2d;
    box-shadow: 0 12px 22px -10px rgba(17,200,213,.8), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .btn.secondary {
    background: #f1eefc; color: var(--purple);
    box-shadow: inset 0 0 0 1.5px rgba(96,94,167,.25);
  }
  .btn svg { width: 17px; height: 17px; }

  /* ---------- sections ---------- */
  .sec { margin-bottom: 9px; }
  .sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .sec-title {
    font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 14px;
    letter-spacing: -.3px; color: var(--ink);
  }
  .count {
    font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 10.5px;
    min-width: 19px; height: 19px; padding: 0 6px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--ink); color: #fff;
  }
  .count.warn { background: var(--pink); }
  .count.exp { background: var(--purple); }
  .sec-action { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--purple); }
  .rows { background: var(--card); border-radius: 20px; overflow: hidden;
    box-shadow: 0 16px 30px -22px rgba(37,29,92,.3); border: 1px solid rgba(37,29,92,.05); }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 13px;
  }
  .row + .row { border-top: 1px solid rgba(37,29,92,.06); }
  .swatch { width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 13px; color: #fff; }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 14px; color: var(--ink); letter-spacing: -.2px; }
  .row-meta { font-size: 11.5px; color: var(--ink-35); margin-top: 1px; }
  .row-qty { font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 16px; color: var(--ink); letter-spacing: -.3px; }
  .row-qty.zero { color: var(--pink); }
  .row-qty small { font-size: 10.5px; font-weight: 700; color: var(--ink-35); margin-left: 1px; }

  .dchip {
    font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 11px;
    padding: 4px 9px; border-radius: 999px; letter-spacing: .2px;
  }
  .dchip.d1 { background: rgba(252,121,164,.18); color: #d63d74; }
  .dchip.d2 { background: rgba(96,94,167,.14); color: var(--purple); }
  .dchip.d3 { background: rgba(198,205,170,.4); color: #6b7046; }

  /* stepper */
  .step { display: flex; align-items: center; gap: 9px; }
  .step button {
    width: 26px; height: 26px; border-radius: 9px; border: none;
    font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .step .minus { background: rgba(37,29,92,.07); color: var(--ink-60); }
  .step .plus { background: var(--cyan); color: #062a2d; box-shadow: 0 6px 12px -6px rgba(17,200,213,.9); }
  .step .q { font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 15.5px; color: var(--ink); min-width: 20px; text-align: center; }

  /* search + chips */
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border-radius: 999px; height: 35px; padding: 0 14px;
    border: 1px solid rgba(37,29,92,.08);
    box-shadow: 0 10px 20px -16px rgba(37,29,92,.35);
    color: var(--ink-35); font-size: 12.5px; margin-bottom: 7px;
  }
  .search svg { width: 14px; height: 14px; }
  .chips { display: flex; gap: 6px; margin-bottom: 7px; }
  .chip {
    font-family: 'Lato', sans-serif; font-size: 11px; font-weight: 700;
    padding: 5px 12px; border-radius: 999px;
    background: rgba(198,205,170,.3); color: #6b7046;
  }
  .chip.on { background: var(--ink); color: #fff; }
  .more { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--purple); padding: 6px 0 0; }

  /* ---------- tab bar ---------- */
  .tabbar {
    margin: 0 14px 14px;
    background: rgba(255,255,255,.92);
    border-radius: 22px;
    border: 1px solid rgba(37,29,92,.07);
    box-shadow: 0 18px 36px -18px rgba(37,29,92,.4);
    display: flex; padding: 6px 6px 7px;
    backdrop-filter: blur(10px);
  }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink-35); }
  .tab svg { width: 19px; height: 19px; }
  .tab span { font-family: 'Lato', sans-serif; font-size: 10px; font-weight: 700; }
  .tab.on { color: var(--ink); }
  .tab.on .dot { width: 16px; height: 3px; border-radius: 2px; background: var(--cyan); }
  .tab .dot { width: 16px; height: 3px; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="cube c1"></div>
    <div class="cube c2"></div>
    <div class="cube c3"></div>

    <div class="scroll">
      <div class="header">
        <div class="house">우리집<em>.</em></div>
        <div class="header-links"><span>가족</span><span>설정</span></div>
      </div>

      <div class="cta-card">
        <button class="btn primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M8 9v6M12 9v6M16 9v6" stroke-width="2"/></svg>
          스캔해서 추가
        </button>
        <button class="btn secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          바로 사용
        </button>
      </div>

      <!-- 구매 필요 -->
      <div class="sec">
        <div class="sec-head">
          <span class="sec-title">구매 필요</span><span class="count warn">2</span>
          <span class="sec-action">장보기 →</span>
        </div>
        <div class="rows">
          <div class="row">
            <div class="swatch" style="background:linear-gradient(135deg,#ff9bbb,var(--pink))">두</div>
            <div class="row-main"><div class="row-name">두부</div><div class="row-meta">300g · 최소 2개</div></div>
            <div class="row-qty zero">0<small>개</small></div>
          </div>
          <div class="row">
            <div class="swatch" style="background:linear-gradient(135deg,#837fdd,var(--purple))">세</div>
            <div class="row-main"><div class="row-name">세탁세제</div><div class="row-meta">2L · 최소 1개</div></div>
            <div class="row-qty">1<small>개</small></div>
          </div>
        </div>
      </div>

      <!-- 유통기한 임박 -->
      <div class="sec">
        <div class="sec-head">
          <span class="sec-title">유통기한 임박</span><span class="count exp">3</span>
        </div>
        <div class="rows">
          <div class="row">
            <div class="swatch" style="background:linear-gradient(135deg,#37dbe6,var(--cyan));color:#062a2d">우</div>
            <div class="row-main"><div class="row-name">서울우유</div><div class="row-meta">1L · 냉장고 · 2개</div></div>
            <span class="dchip d1">D-1</span>
          </div>
          <div class="row">
            <div class="swatch" style="background:linear-gradient(135deg,#837fdd,var(--purple))">요</div>
            <div class="row-main"><div class="row-name">그릭요거트</div><div class="row-meta">450g · 냉장고 · 1개</div></div>
            <span class="dchip d2">D-2</span>
          </div>
          <div class="row">
            <div class="swatch" style="background:linear-gradient(135deg,#d4dabd,var(--sage));color:#555a35">계</div>
            <div class="row-main"><div class="row-name">계란</div><div class="row-meta">30구 · 냉장고 · 10개</div></div>
            <span class="dchip d3">D-4</span>
          </div>
        </div>
      </div>

      <!-- 최근 사용 -->
      <div class="sec">
        <div class="sec-head">
          <span class="sec-title">최근 사용</span><span class="count">2</span>
        </div>
        <div class="rows">
          <div class="row">
            <div class="row-main"><div class="row-name">계란</div><div class="row-meta">30구</div></div>
            <div class="step"><button class="minus">−</button><span class="q">10</span><button class="plus">+</button></div>
          </div>
          <div class="row">
            <div class="row-main"><div class="row-name">양파</div><div class="row-meta">1망</div></div>
            <div class="step"><button class="minus">−</button><span class="q">4</span><button class="plus">+</button></div>
          </div>
        </div>
      </div>

      <!-- 전체 재고 -->
      <div class="sec">
        <div class="sec-head">
          <span class="sec-title">전체 재고</span><span class="count">12</span>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          상품명·브랜드 검색
        </div>
        <div class="chips">
          <span class="chip on">전체</span><span class="chip">냉장고</span><span class="chip">냉동고</span><span class="chip">팬트리</span>
        </div>
        <div class="rows">
          <div class="row">
            <div class="row-main"><div class="row-name">서울우유</div><div class="row-meta">냉장고 · 유통기한 09/24</div></div>
            <div class="step"><button class="minus">−</button><span class="q">2</span><button class="plus">+</button></div>
          </div>
          <div class="row">
            <div class="row-main"><div class="row-name">계란</div><div class="row-meta">냉장고 · 유통기한 09/27</div></div>
            <div class="step"><button class="minus">−</button><span class="q">10</span><button class="plus">+</button></div>
          </div>
        </div>
        <div class="more">더 보기 · 전체 12개</div>
      </div>
    </div>

    <div class="tabbar">
      <div class="tab on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
        <span>홈</span><div class="dot"></div>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5 12 3l8 3.5v11L12 21l-8-3.5z"/><path d="M4 6.5 12 10l8-3.5M12 10v11"/></svg>
        <span>재고</span><div class="dot"></div>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/><path d="M3 4h2.4l2.6 12h10.4l2-8.5H7"/></svg>
        <span>장보기</span><div class="dot"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
